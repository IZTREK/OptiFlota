services:

  frontend:
    image: nginx:alpine
    container_name: optiflota_nginx
    ports:
      - "9090:80"
    volumes:
      - ./:/usr/share/nginx/html
      - ./uploads:/usr/share/nginx/html/uploads
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - red_publica
    restart: always

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optiflota_php
    volumes:
      - ./:/usr/share/nginx/html
    depends_on:
      - db
    networks:
      - red_publica
      - red_privada
    restart: always

  db:
    image: mysql:8.0
    container_name: optiflota_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: optiflota_db
      MYSQL_USER: optiflota_user
      MYSQL_PASSWORD: password123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red_privada
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: optiflota_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - red_publica
      - red_privada
    restart: always

  # NUEVO: Contenedor para escuchar los pagos de Stripe
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: optiflota_stripe_cli
    # REEMPLAZAR ESTE POR EL REAL
    command: "listen --api-key sk_test_51TrepOGz0qKL4xBEVqKrIBXd4tsdQmNLT7iNTTktNg3jE6H1yRb73nPFmH1207bSXyxKxo8XcMJMq7Ty6VlMRQPu00U6hJ0A27 --forward-to http://frontend/Back-end/webhook/stripe.php"
    networks:
      - red_publica
    depends_on:
      - frontend
    restart: always

networks:
  red_publica:
    driver: bridge
  red_privada:
    driver: bridge

volumes:
  db_data: