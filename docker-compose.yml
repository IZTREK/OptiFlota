services:
  frontend:
    image: nginx:alpine
    container_name: optiflota_nginx
    ports:
      - "9090:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - red_publica

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optiflota_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - red_publica

  db:
    image: mysql:8.0
    container_name: optiflota_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: optiflota_db
      MYSQL_USER: optiflota_user
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red_publica

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: optiflota_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - red_publica

  # stripe-cli:
  #   image: stripe/stripe-cli:latest
  #   container_name: optiflota_stripe_cli
  #   command: listen --api-key ${STRIPE_API_KEY} --forward-to http://frontend/Back-end/webhook/stripe.php
  #   env_file:
  #     - .env
  #   depends_on:
  #     - frontend
  #   networks:
  #     - red_publica

volumes:
  mysql_data:

networks:
  red_publica:
    driver: bridge