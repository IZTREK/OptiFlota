<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiFlota - Registro</title>
    <link rel="stylesheet" href="../../Estilos/styles.css"> 
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para comenzar a gestionar tu flotilla</p>
            </div>
            
            <form class="login-form" id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="correo@empresa.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Registrarse</button>
                    <a href="login.html" class="btn-secondary" style="flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; text-decoration: none;">Cancelar</a>
                </div>
            </form>
            
            <div class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registro-form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Las contraseñas no coinciden. Por favor, inténtalo de nuevo.');
            }
        });
    </script>
</body>
</html>
