<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiFlota - Iniciar Sesión</title>
    <link rel="stylesheet" href="../../Estilos/styles.css"> 
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>OptiFlota</h2>
                <p>Ingresa tus credenciales para acceder al panel</p>
            </div>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@transportesgarcia.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            
            <div class="login-footer">
                <p>¿Problemas con tu acceso? <a href="#" id="btn-abrir-ticket">Contacta a soporte</a></p>
                <div style="margin-top: 15px;">
                    <a href="registro.html" class="btn-secondary" style="display: block; text-align: center; text-decoration: none;">Nuevo Usuario</a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-ticket-login">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reportar Problema</h2>
                <button class="btn-close" id="btn-cerrar-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form class="data-form">
                    <div class="form-group">
                        <label>Tu Correo Electrónico</label>
                        <input type="email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Asunto del Problema</label>
                        <select required>
                            <option value="acceso">No puedo iniciar sesión</option>
                            <option value="olvido">Olvidé mi contraseña</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción del Problema</label>
                        <textarea rows="4" placeholder="Describe qué sucede..." required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                <button class="btn-primary">Enviar Ticket</button>
            </div>
        </div>
    </div>

    <script src="../js/cliente/login.js"></script>
</body>
</html>
