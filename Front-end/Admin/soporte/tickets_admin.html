<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiFlota Admin - Soporte Técnico Global</title>
    <link rel="stylesheet" href="../../../Estilos/styles.css">
    <style>
        .form-group textarea, .form-group select {
            width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 15px;
        }
        .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar" style="background-color: #111827;">
            <div class="sidebar-logo"><h2>OptiFlota <span style="color: var(--primary-color); font-size: 14px;">ADMIN</span></h2></div>
            <nav class="sidebar-nav">
                <a href="../admin_dashboard.html" class="nav-item">Vista Global</a>
                <a href="../empresas/empresas.html" class="nav-item">Empresas</a>
                <a href="../pagos/pagos.html" class="nav-item">Control de Pagos</a>
                <a href="tickets_admin.html" class="nav-item active">Soporte Técnico</a>
            </nav>
        </aside> 

        <div class="main-content">
            <header class="topbar">
                <div class="page-title"><h1>Soporte Técnico Global</h1></div>
                <div class="user-profile"><span id="admin-name">Cargando...</span><div class="avatar" style="background-color: #4b5563;">SA</div></div>
            </header>

            <main class="content-area">
                <section class="kpi-grid">
                    <div class="kpi-card"><h3>Tickets Pendientes</h3><p class="kpi-value" id="kpi-pendientes" style="color: var(--danger);">0</p></div>
                    <div class="kpi-card"><h3>Tickets en Proceso</h3><p class="kpi-value" id="kpi-proceso" style="color: var(--warning);">0</p></div>
                </section>
                
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>Cliente / Empresa</label>
                        <input type="text" id="filtro-empresa" placeholder="Ej. Transportes García" style="padding: 10px; border-radius: 6px; border: 1px solid #d1d5db;">
                    </div>
                    <div class="filter-group">
                        <label>Estado</label>
                        <select id="filtro-estado" style="padding: 10px; border-radius: 6px; border: 1px solid #d1d5db;">
                            <option value="Todos">Todos</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="en proceso">En Proceso</option>
                            <option value="resuelto">Resuelto</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-secondary" id="btn-limpiar-filtros">Limpiar</button>
                        <button class="btn-primary" id="btn-buscar-filtros" style="display: inline-flex; align-items: center; gap: 6px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                            <span>Filtrar</span>
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr><th>Fecha</th><th>Empresa</th><th>Ticket ID</th><th>Asunto</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="6" style="text-align:center;">Cargando tickets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modal-atencion">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="ticket-modal-title">Atender Ticket</h2>
                <button class="btn-close" id="btn-cerrar-modal">&times;</button>
            </div>
            
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px;">
                    <p><strong>Cliente:</strong> <span id="ticket-modal-empresa">-</span></p>
                    <p><strong>Fecha:</strong> <span id="ticket-modal-fecha">-</span></p>
                </div>
                
                <div id="admin-chat-historial" style="background: #f9fafb; padding: 15px; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 20px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    </div>

                <form class="data-form">
                    <div class="form-group">
                        <label>Escribir Respuesta:</label>
                        <textarea rows="4" id="admin-respuesta" placeholder="Escribe aquí la solución. El cliente recibirá una notificación..." required style="resize: vertical;"></textarea>
                    </div>

                    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed #d1d5db; padding-top: 15px; margin-top: 15px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <label style="font-weight: 600; color: var(--text-main); margin: 0;">Nuevo Estado:</label>
                            <select id="select-estado-ticket" style="width: auto;">
                                <option value="Pendiente">Pendiente</option>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Resuelto">Resuelto</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancelar-atencion">Cancelar</button>
                <button class="btn-primary" id="btn-actualizar-estado">Enviar Respuesta y Actualizar</button>
            </div>
        </div>
    </div>

    <script src="../../js/admin/tickets_admin.js"></script>
</body>
</html>
